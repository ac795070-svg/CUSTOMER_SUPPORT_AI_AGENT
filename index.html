<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Support Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Segoe UI, Arial, sans-serif;
    background: #0f172a; height: 100vh; display: flex;
    align-items: center; justify-content: center;
  }
  .chat-container {
    width: 420px; height: 620px; background: #1e293b;
    border-radius: 14px; display: flex; flex-direction: column;
    overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .chat-header {
    background: #2563eb; color: #fff; padding: 16px;
    font-size: 18px; font-weight: 600;
  }
  .chat-messages {
    flex: 1; padding: 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 75%; padding: 10px 14px; border-radius: 12px;
    line-height: 1.4; font-size: 14px; white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
  .agent { align-self: flex-start; background: #334155; color: #e2e8f0; border-bottom-left-radius: 2px; }
  .typing { align-self: flex-start; color: #94a3b8; font-size: 13px; font-style: italic; }
  .chat-input {
    display: flex; padding: 12px; border-top: 1px solid #334155; background: #1e293b;
  }
  .chat-input input {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: none;
    background: #0f172a; color: #fff; font-size: 14px; outline: none;
  }
  .chat-input button {
    margin-left: 8px; padding: 10px 16px; border: none; border-radius: 8px;
    background: #2563eb; color: #fff; font-weight: 600; cursor: pointer;
  }
  .chat-input button:hover { background: #1d4ed8; }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">🛟 Customer Support</div>
  <div class="chat-messages" id="messages"></div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const API_URL = "c/chat";
  const sessionId = "session_" + Math.random().toString(36).slice(2);

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("userInput");

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, "user");
    inputEl.value = "";

    const typingEl = document.createElement("div");
    typingEl.className = "typing";
    typingEl.textContent = "Agent is typing...";
    messagesEl.appendChild(typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          user_id: "web_user",
          session_id: sessionId
        })
      });
      const data = await res.json();
      typingEl.remove();
      addMessage(data.reply || "(no reply)", "agent");
    } catch (err) {
      typingEl.remove();
      addMessage("⚠️ Could not reach server. Is app.py running?", "agent");
    }
  }

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
